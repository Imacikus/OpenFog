<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenFog</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    /* ===== THEME (Material Design 3) =====
       Die --md-sys-color-*-Werte werden zur Laufzeit aus dem Seed-Farbton
       generiert (src/theme.js, @material/material-color-utilities) und als
       Inline-Styles auf :root gesetzt. Hier stehen Fallbacks (Dark), damit
       der erste Paint vor JS-Ausführung nicht kaputt ist. */
    :root {
      --md-sys-color-primary: #8b85ff;
      --md-sys-color-on-primary: #21145c;
      --md-sys-color-primary-container: #3f3195;
      --md-sys-color-on-primary-container: #e5deff;
      --md-sys-color-secondary: #c8c4e8;
      --md-sys-color-on-secondary: #302e4a;
      --md-sys-color-secondary-container: #46446a;
      --md-sys-color-on-secondary-container: #e4e0ff;
      --md-sys-color-tertiary: #edb7d9;
      --md-sys-color-on-tertiary: #4a243d;
      --md-sys-color-tertiary-container: #643a54;
      --md-sys-color-on-tertiary-container: #ffd7f0;
      --md-sys-color-error: #ffb4ab;
      --md-sys-color-on-error: #690005;
      --md-sys-color-error-container: #93000a;
      --md-sys-color-on-error-container: #ffdad6;
      --md-sys-color-background: #131318;
      --md-sys-color-on-background: #e5e1e9;
      --md-sys-color-surface: #131318;
      --md-sys-color-on-surface: #e5e1e9;
      --md-sys-color-surface-variant: #48464f;
      --md-sys-color-on-surface-variant: #c9c5d0;
      --md-sys-color-surface-container-lowest: #0e0e12;
      --md-sys-color-surface-container-low: #1b1a20;
      --md-sys-color-surface-container: #1f1e24;
      --md-sys-color-surface-container-high: #292831;
      --md-sys-color-surface-container-highest: #34333d;
      --md-sys-color-outline: #938f9c;
      --md-sys-color-outline-variant: #48464f;
      --md-sys-color-scrim: #000000;
      --md-sys-color-shadow: #000000;

      /* ===== Semantische Aliase (App-Komponenten) ===== */
      --accent: var(--md-sys-color-primary);
      --accent-glow: color-mix(in srgb, var(--md-sys-color-primary) 35%, transparent);
      --danger: var(--md-sys-color-error);
      --danger-glow: color-mix(in srgb, var(--md-sys-color-error) 35%, transparent);
      --success: var(--md-sys-color-tertiary);
      --text: var(--md-sys-color-on-surface);
      --text-muted: var(--md-sys-color-on-surface-variant);
      --text-bright: var(--md-sys-color-on-surface);
      --glass-bg: var(--md-sys-color-surface-container);
      --glass-border: var(--md-sys-color-outline-variant);
      --state-overlay: rgba(255, 255, 255, 0.08);
      --radius: 12px;
      --radius-lg: 16px;
      --radius-full: 999px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
      --ease-out: cubic-bezier(0.32, 0.72, 0, 1);
      --transition: 0.35s var(--ease-out);

      /* Karte & Nebel: dunkle Variante */
      --map-bg: #131318;
      --fog-overlay: #0f0f13;
      --fog-border: rgba(255, 255, 255, 0.04);
      --track-outline: rgba(255, 255, 255, 0.25);
    }

    /* ===== LIGHT SCHEME (nicht mehr verwendet – App rendert nur Dark) ===== */

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Oxygen, Ubuntu, sans-serif;
      background: var(--md-sys-color-background);
      color: var(--text);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      touch-action: manipulation;
      -ms-touch-action: manipulation;
    }

    button, .header-btn, .fab, .modal-btn, .file-input-label, .sheet-preview {
      touch-action: manipulation;
      cursor: pointer;
    }

    /* ===== GLASS UTILITY ===== */
    .glass {
      -webkit-backdrop-filter: blur(16px) saturate(1.2);
      backdrop-filter: blur(16px) saturate(1.2);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
    }

    @supports not ((-webkit-backdrop-filter: blur(16px)) or (backdrop-filter: blur(16px))) {
      .glass {
        background: var(--md-sys-color-surface-container);
      }
    }

    @media (-webkit-min-device-pixel-ratio: 0) {
      .glass { will-change: transform; }
    }

    /* ===== MAP ===== */
    #map {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ===== SAFE AREA (Notch phones) ===== */
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    /* ===== HEADER (MD3 Top App Bar) ===== */
    #header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      padding-top: var(--safe-top);
      border: none;
      min-height: 48px;
      animation: fadeSlideDown 0.4s ease 0.1s forwards;
      opacity: 0;
    }

    #appTitle {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: var(--text-bright);
    }

    #appTitle i {
      margin-right: 8px;
      color: var(--accent);
    }

    .header-actions {
      display: flex;
      gap: 4px;
    }

    .header-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .header-btn:hover {
      background: var(--state-overlay);
      color: var(--text-bright);
    }

    .header-btn:active {
      transform: scale(0.92);
    }

    /* ===== FAB (MD3) ===== */
    .fab {
      position: fixed;
      z-index: 999;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      border: none;
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 6px 12px color-mix(in srgb, var(--md-sys-color-shadow) 30%, transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      animation: popIn 0.4s var(--ease-out) 0.2s forwards;
      opacity: 0;
      transform: scale(0.5);
      bottom: calc(76px + var(--safe-bottom));
      right: 20px;
    }

    .fab:hover {
      box-shadow: 0 6px 16px color-mix(in srgb, var(--md-sys-color-shadow) 40%, transparent);
      background: color-mix(in srgb, var(--md-sys-color-primary-container) 80%, var(--md-sys-color-primary) 20%);
    }

    .fab:active {
      transform: scale(0.92);
    }

    .fab.tracking {
      background: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
      box-shadow: 0 6px 12px color-mix(in srgb, var(--md-sys-color-error) 40%, transparent);
      animation: pulse-ring 1.5s ease infinite, popIn 0.4s var(--ease-out) 0.2s forwards;
    }

    .fab.searching {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      box-shadow: 0 6px 12px color-mix(in srgb, var(--md-sys-color-secondary) 40%, transparent);
      animation: pulse-ring 0.8s ease infinite, popIn 0.4s var(--ease-out) 0.2s forwards;
    }

    /* ===== PANEL SECTION (shared) ===== */
    .panel-section {
      margin-bottom: 20px;
    }

    .panel-section h3 {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .panel-section h3 i {
      margin-right: 8px;
      color: var(--accent);
    }

    .panel-section p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* Stat rows */
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      font-size: 0.85rem;
    }

    .stat-row span:first-child {
      color: var(--text-muted);
    }

    .stat-row span:last-child {
      font-weight: 600;
      color: var(--text-bright);
    }

    /* Level display */
    .level-display {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 4px 0;
    }

    .level-number {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
    }

    .xp-bar {
      width: 100%;
      height: 4px;
      background: var(--md-sys-color-surface-container-highest);
      border-radius: 2px;
      overflow: hidden;
    }

    .xp-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.5s ease;
    }

    .xp-text {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* ===== ACHIEVEMENTS (MD3 Cards) ===== */
    .achievements-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .achievement-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--md-sys-color-surface-container-low);
      border-radius: var(--radius-lg);
      transition: all 0.35s ease;
    }

    .achievement-card.unlocked {
      background: var(--md-sys-color-secondary-container);
    }

    .achievement-card.locked {
      opacity: 0.4;
    }

    .achievement-icon {
      font-size: 1.15rem;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--md-sys-color-surface-container-highest);
      border-radius: 50%;
      flex-shrink: 0;
    }

    .achievement-card.unlocked .achievement-icon {
      background: var(--md-sys-color-secondary);
      color: var(--md-sys-color-on-secondary);
    }

    .achievement-info h4 {
      font-size: 0.85rem;
      color: var(--text-bright);
      margin-bottom: 2px;
    }

    .achievement-info p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .modal-btn {
      padding: 10px 20px;
      border: none;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      position: relative;
      overflow: hidden;
    }

    .modal-btn:active {
      transform: scale(0.95);
    }

    .modal-btn-primary {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
    }

    .modal-btn-primary:hover {
      background: color-mix(in srgb, var(--md-sys-color-primary) 85%, var(--md-sys-color-on-primary) 15%);
      box-shadow: 0 2px 12px var(--accent-glow);
    }

    .modal-btn-secondary {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }

    .modal-btn-secondary:hover {
      background: color-mix(in srgb, var(--md-sys-color-secondary-container) 85%, var(--md-sys-color-secondary) 15%);
    }

    .modal-btn-success {
      background: var(--md-sys-color-tertiary-container);
      color: var(--md-sys-color-on-tertiary-container);
    }

    .modal-btn-success:hover {
      box-shadow: 0 2px 12px color-mix(in srgb, var(--md-sys-color-tertiary) 40%, transparent);
    }

    .modal-btn-danger {
      background: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
    }

    .modal-btn-danger:hover {
      background: color-mix(in srgb, var(--md-sys-color-error-container) 85%, var(--md-sys-color-error) 15%);
      box-shadow: 0 2px 12px var(--danger-glow);
    }

    .file-input-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      transition: all 0.2s ease;
    }

    .file-input-label:hover {
      background: color-mix(in srgb, var(--md-sys-color-primary) 85%, var(--md-sys-color-on-primary) 15%);
      box-shadow: 0 2px 12px var(--accent-glow);
    }

    .file-input-label:active {
      transform: scale(0.95);
    }

    .import-progress {
      margin-top: 14px;
    }

    .import-progress-bar {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: var(--md-sys-color-surface-container-highest);
      overflow: hidden;
    }

    .import-progress-fill {
      width: 0%;
      height: 100%;
      border-radius: 2px;
      background: var(--accent);
      transition: width 0.25s var(--ease-out);
    }

    .import-progress-label {
      margin-top: 8px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    input[type="file"] {
      display: none;
    }

    .modal-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 var(--danger-glow); }
      70%  { box-shadow: 0 0 0 18px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }

    /* ===== NAVIGATION BAR (MD3) ===== */
    #tabBar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(80px + var(--safe-bottom));
      z-index: 1002;
      display: flex;
      align-items: stretch;
      justify-content: space-around;
      border-top: none;
      border-bottom: none;
      padding-bottom: var(--safe-bottom);
      background: var(--md-sys-color-surface-container);
    }

    .tab-btn {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px 0;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.6rem;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .tab-btn i {
      font-size: 1.25rem;
      transition: transform 0.2s;
    }

    .tab-btn.active {
      color: var(--md-sys-color-on-surface);
      font-weight: 600;
    }

    .tab-btn.active i {
      transform: scale(1.05);
    }

    .tab-btn.active::before {
      content: '';
      position: absolute;
      top: 16.5px;
      left: 50%;
      transform: translateX(-50%);
      width: 64px;
      height: 32px;
      border-radius: 16px;
      background: var(--md-sys-color-secondary-container);
      transition: background 0.2s;
    }

    .tab-btn.active i,
    .tab-btn.active span {
      position: relative;
      z-index: 1;
    }

    /* ===== TAB PANELS ===== */
    .tab-panel {
      position: fixed;
      top: 48px;
      left: 0;
      right: 0;
      bottom: calc(80px + var(--safe-bottom));
      z-index: 500;
      display: none;
      overflow: hidden;
    }

    .tab-panel.active {
      display: block;
    }

    .tab-panel-map {
      pointer-events: none;
      z-index: 1;
    }

    .tab-panel-content {
      z-index: 1001;
      background: var(--md-sys-color-surface);
      border: none;
    }

    .panel-scroll {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 20px 24px;
    }

    .panel-scroll::-webkit-scrollbar {
      width: 4px;
    }

    .panel-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .panel-scroll::-webkit-scrollbar-thumb {
      background: var(--md-sys-color-outline-variant);
      border-radius: 2px;
    }

    /* ===== SETTINGS TOGGLE ===== */
    .settings-row {
      margin-bottom: 20px;
    }

    .settings-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 12px 0;
      font-size: 0.9rem;
    }

    .settings-toggle span i {
      margin-right: 8px;
      color: var(--accent);
    }

    .settings-toggle input[type="checkbox"] {
      appearance: none;
      width: 52px;
      height: 32px;
      background: var(--md-sys-color-surface-container-highest);
      border: 2px solid var(--md-sys-color-outline);
      border-radius: 16px;
      position: relative;
      cursor: pointer;
      transition: 0.2s;
      flex-shrink: 0;
    }

    .settings-toggle input[type="checkbox"]::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--md-sys-color-outline);
      box-shadow: 0 1px 2px var(--md-sys-color-scrim);
      transition: 0.2s;
    }

    .settings-toggle input[type="checkbox"]:checked {
      background: var(--md-sys-color-primary);
      border-color: var(--md-sys-color-primary);
    }

    .settings-toggle input[type="checkbox"]:checked::after {
      left: 22px;
      background: var(--md-sys-color-on-primary);
    }

    /* ===== LEAFLET OVERRIDES ===== */
    .leaflet-container {
      background: var(--map-bg) !important;
    }

    .leaflet-control-zoom a {
      background: var(--md-sys-color-surface-container) !important;
      color: var(--text) !important;
      border-color: var(--glass-border) !important;
    }

    .leaflet-control-attribution {
      background: rgba(0,0,0,0.3) !important;
      color: var(--text-muted) !important;
      font-size: 10px !important;
    }

    .leaflet-control-attribution a {
      color: var(--text-muted) !important;
    }

    /* ===== ERROR STATE ===== */
    #map .map-error {
      padding: 40px;
      text-align: center;
      color: var(--danger);
    }
    #map .map-error h2 { font-size: 1.3rem; margin-bottom: 8px; }
    #map .map-error p { font-size: 0.85rem; }
    #map .map-error small { font-size: 0.75rem; opacity: 0.6; }
  </style>
</head>
<body>
  <!-- Header -->
  <div id="header" class="glass">
    <span id="appTitle"><i class="fas fa-globe"></i> OpenFog</span>
    <div class="header-actions">
      <button class="header-btn" onclick="locateMe()" title="Standort">
        <i class="fas fa-crosshairs"></i>
      </button>
    </div>
  </div>

  <!-- Map -->
  <div id="map"></div>

  <!-- FAB -->
  <button id="fabTrack" class="fab" onclick="toggleTracking()" title="Tracking starten">
    <i class="fas fa-map-marker-alt"></i>
  </button>

  <!-- Tab Panels -->
  <!-- Panel: Map (transparent, shows map behind) -->
  <div id="panelMap" class="tab-panel tab-panel-map active"></div>

  <!-- Panel: Profile -->
  <div id="panelProfile" class="tab-panel tab-panel-content glass">
    <div class="panel-scroll">
      <div class="panel-section">
        <h3><i class="fas fa-map-marked-alt"></i> Enthüllte Fläche</h3>
        <div class="stat-row"><span>Fläche</span><span id="profileArea">0 km²</span></div>
        <div class="stat-row"><span>Prozent der Welt</span><span id="profilePercent">0 %</span></div>
        <div class="stat-row"><span>Distanz</span><span id="profileDistance">0 km</span></div>
        <div class="stat-row"><span>Tracks</span><span id="profileTrackCount">0</span></div>
      </div>
      <div class="panel-section">
        <h3><i class="fas fa-level-up-alt"></i> Level</h3>
        <div class="level-display">
          <span class="level-number" id="profileLevel">1</span>
          <div class="xp-bar"><div class="xp-bar-fill" id="profileXpBarFill" style="width:0%"></div></div>
          <span class="xp-text"><span id="profileXP">0</span>&thinsp;/&thinsp;<span id="profileNextXP">500</span> XP</span>
        </div>
      </div>
      <div class="panel-section">
        <h3><i class="fas fa-trophy"></i> Erfolge</h3>
        <div id="profileAchievementsList" class="achievements-list"></div>
      </div>
    </div>
  </div>

  <!-- Panel: Settings -->
  <div id="panelSettings" class="tab-panel tab-panel-content glass">
    <div class="panel-scroll">
      <div class="settings-row">
        <label class="settings-toggle">
          <span><i class="fas fa-route"></i> Tracks anzeigen</span>
          <input type="checkbox" id="toggleTracks" onchange="toggleTracks()">
        </label>
      </div>

      <div class="panel-section">
        <h3><i class="fas fa-file-import"></i> Track importieren</h3>
        <p>GPX-, KML- oder KMZ-Datei auswählen</p>
        <label for="fileInput" class="file-input-label"><i class="fas fa-folder-open"></i> Datei auswählen</label>
        <input type="file" id="fileInput" accept=".gpx,.kml,.kmz" onchange="handleFileImport(event)">
        <div id="importProgress" class="import-progress" style="display:none;">
          <div class="import-progress-bar"><div id="importProgressFill" class="import-progress-fill"></div></div>
          <div id="importProgressLabel" class="import-progress-label">Importiere…</div>
        </div>
      </div>

      <div class="panel-section">
        <h3><i class="fas fa-database"></i> Daten sichern / wiederherstellen</h3>
        <div class="modal-actions">
          <button class="modal-btn modal-btn-primary" onclick="exportDatabase()"><i class="fas fa-download"></i> Export</button>
          <label class="modal-btn modal-btn-success"><i class="fas fa-upload"></i> Import
            <input type="file" id="dbFileInput" accept=".json" onchange="importDatabase(event)" style="display:none;">
          </label>
        </div>
      </div>

      <div class="panel-section">
        <h3><i class="fas fa-exclamation-triangle"></i> Daten zurücksetzen</h3>
        <p style="font-size:0.8rem;color:var(--text-muted);">Nicht rückgängig machbar</p>
        <div class="modal-actions">
          <button class="modal-btn modal-btn-danger" onclick="resetAllData()"><i class="fas fa-trash-alt"></i> Alles zurücksetzen</button>
        </div>
        <div class="modal-actions">
          <button class="modal-btn modal-btn-danger" onclick="resetTracksAndStats()"><i class="fas fa-route"></i> Tracks + Statistik</button>
          <button class="modal-btn modal-btn-danger" onclick="resetFogOnly()"><i class="fas fa-cloud"></i> Nur Nebel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Tab Bar -->
  <div id="tabBar" class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('map')" title="Karte">
      <i class="fas fa-map"></i>
      <span>Karte</span>
    </button>
    <button class="tab-btn" onclick="switchTab('profile')" title="Profil">
      <i class="fas fa-user"></i>
      <span>Profil</span>
    </button>
    <button class="tab-btn" onclick="switchTab('settings')" title="Einstellungen">
      <i class="fas fa-cog"></i>
      <span>Einstellungen</span>
    </button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
